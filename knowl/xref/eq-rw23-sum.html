\begin{align}
\cosh^2(x) + \sinh^2(x)
\amp = \frac14\left(e^x + e^{-x}\right)^2
+ \frac14\left(e^x - e^{-x}\right)^2\notag\\
\amp = \frac14\left(2e^{2x} + 2e^{-2x}\right)\notag\\
\amp
= \frac12\left(e^{2x} + e^{-2x}\right).\tag{5.4.2}
\end{align}
